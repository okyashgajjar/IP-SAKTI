<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayurveda IP Advisor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#0a0e1a;--bg2:#111827;--card:#1a1f35;--input:#1e2438;
            --accent:#6366f1;--accent2:#818cf8;--glow:rgba(99,102,241,.25);
            --t1:#f1f5f9;--t2:#94a3b8;--t3:#64748b;--border:#2d3555;
            --ok:#22c55e;--warn:#f59e0b;--err:#ef4444;
        }
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);height:100vh;display:flex;flex-direction:column;overflow:hidden}

        .header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--bg2);border-bottom:1px solid var(--border)}
        .header-brand{display:flex;align-items:center;gap:12px}
        .header-logo{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),#a78bfa);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
        .header-title{font-size:18px;font-weight:600}
        .header-sub{font-size:12px;color:var(--t3)}
        .badge{padding:4px 12px;background:rgba(34,197,94,.15);color:var(--ok);border-radius:20px;font-size:11px;font-weight:500}

        .main{display:flex;flex:1;overflow:hidden}

        .sidebar{width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
        .new-chat-btn{display:flex;align-items:center;gap:12px;padding:16px;font-weight:500;font-size:14px;color:var(--t1);cursor:pointer;transition:.2s;border-bottom:1px solid var(--border)}
        .new-chat-btn:hover{background:rgba(255,255,255,.05)}
        .sessions-list{flex:1;overflow-y:auto;padding:12px 8px}
        .sessions-list::-webkit-scrollbar{width:4px}
        .sessions-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
        .sidebar-title{font-size:11px;font-weight:600;color:var(--t3);padding:0 8px 8px;letter-spacing:.5px;text-transform:uppercase}
        .session-item{padding:10px 12px;font-size:13px;color:var(--t2);cursor:pointer;border-radius:8px;transition:.2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
        .session-item:hover{background:rgba(255,255,255,.05);color:var(--t1)}
        .session-item.active{background:var(--card);color:var(--t1);font-weight:500}
        
        .sidebar-footer{padding:16px;border-top:1px solid var(--border)}
        .jtoggle{background:var(--card);padding:10px;border-radius:10px;border:1px solid var(--border)}
        .jtoggle label{font-size:11px;color:var(--t3);font-weight:600;display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
        .tg{display:flex;gap:4px}
        .tb{flex:1;padding:6px;background:0;border:1px solid var(--border);border-radius:6px;color:var(--t2);font-size:11px;font-weight:500;cursor:pointer;transition:.2s;font-family:inherit}
        .tb.on{background:var(--accent);border-color:var(--accent);color:#fff}

        .chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
        .msgs{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
        .msgs::-webkit-scrollbar{width:6px}
        .msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

        .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;padding:40px}
        .welcome-icon{width:80px;height:80px;background:linear-gradient(135deg,var(--accent),#a78bfa);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 0 60px var(--glow)}
        .welcome h2{font-size:24px;font-weight:600}
        .welcome p{font-size:14px;color:var(--t2);max-width:480px;line-height:1.6}
        .examples{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:600px}
        .eq{padding:8px 16px;background:var(--card);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--t2);cursor:pointer;transition:.2s;font-family:inherit}
        .eq:hover{border-color:var(--accent);color:var(--t1);background:rgba(99,102,241,.1)}

        .msg{display:flex;gap:12px;max-width:75%;animation:fi .3s ease}
        @keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .msg.user{align-self:flex-end;flex-direction:row-reverse}
        .msg.bot{align-self:flex-start}
        .av{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
        .user .av{background:var(--accent)}
        .bot .av{background:var(--card);border:1px solid var(--border)}
        .bubble{padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.65;word-wrap:break-word;width:100%}
        .user .bubble{background:var(--accent);border-bottom-right-radius:4px}
        .bot .bubble{background:#1e293b;border:1px solid var(--border);border-bottom-left-radius:4px}
        .bot .bubble h3{font-size:15px;color:var(--accent2);margin:12px 0 6px}
        .bot .bubble ul{padding-left:20px;margin:6px 0}
        .bot .bubble li{margin-bottom:4px}
        .bot .bubble code{background:rgba(99,102,241,.15);padding:2px 6px;border-radius:4px;font-size:12px}
        .bot .bubble strong{color:var(--accent2)}

        .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
        .chip{padding:3px 10px;border-radius:12px;font-size:10px;font-weight:500}
        .cs{background:rgba(59,130,246,.15);color:#93c5fd}
        .ch{background:rgba(34,197,94,.15);color:#86efac}
        .cm{background:rgba(245,158,11,.15);color:#fcd34d}
        .cl{background:rgba(239,68,68,.15);color:#fca5a5}
        .cj{background:rgba(168,85,247,.15);color:#d8b4fe}

        .thinking{display:flex;gap:12px;align-self:flex-start;animation:fi .3s ease}
        .tdots{padding:12px 16px;background:#1e293b;border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:4px;display:flex;gap:6px;align-items:center}
        .tdots span{width:8px;height:8px;border-radius:50%;background:var(--t3);animation:bounce 1.4s infinite ease-in-out}
        .tdots span:nth-child(2){animation-delay:.2s}
        .tdots span:nth-child(3){animation-delay:.4s}
        @keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

        .inp-area{padding:16px 24px;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0}
        .inp-wrap{display:flex;align-items:center;gap:12px;background:var(--input);border:1px solid var(--border);border-radius:14px;padding:4px 4px 4px 16px;transition:.2s}
        .inp-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
        .inp-wrap input{flex:1;background:0;border:0;outline:0;color:var(--t1);font-size:14px;font-family:inherit}
        .inp-wrap input::placeholder{color:var(--t3)}
        .send{width:40px;height:40px;background:var(--accent);border:0;border-radius:10px;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
        .send:hover{background:var(--accent2);transform:scale(1.05)}
        .send:disabled{opacity:.4;cursor:not-allowed;transform:none}
        .disclaimer{font-size:11px;color:var(--t3);text-align:center;margin-top:8px}

        @media(max-width:768px){.sidebar{display:none}.msg{max-width:90%}}
    </style>
</head>
<body>
    <header class="header">
        <div class="header-brand">
            <div class="header-logo">⚖️</div>
            <div><div class="header-title">Ayurveda IP Advisor</div><div class="header-sub">AI-Powered Legal Guidance</div></div>
        </div>
        <div class="badge">● ONLINE</div>
    </header>

    <div class="main">
        <aside class="sidebar">
            <div class="new-chat-btn" onclick="newChat()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                New chat
            </div>
            
            <div class="sessions-list" id="sessions-list">
                <div class="sidebar-title">Recents</div>
                <!-- Sessions will be loaded here -->
            </div>

            <div class="sidebar-footer">
                <div class="jtoggle">
                    <label>Jurisdiction Lane</label>
                    <div class="tg">
                        <button class="tb on" onclick="setJ('IN',this)">🇮🇳 India</button>
                        <button class="tb" onclick="setJ('INTL',this)">🌐 Intl.</button>
                    </div>
                </div>
            </div>
        </aside>

        <div class="chat-wrap">
            <div class="msgs" id="msgs">
                <!-- Welcome screen or messages -->
            </div>
            <div class="inp-area">
                <div class="inp-wrap">
                    <input type="text" id="qi" placeholder="Ask about Ayurveda IP, regulations, or ABS compliance..." autocomplete="off">
                    <button class="send" id="sb" onclick="send()">➤</button>
                </div>
                <div class="disclaimer">This is informational guidance, not legal advice. Always consult a qualified IP attorney.</div>
            </div>
        </div>
    </div>

    <!-- Hidden welcome template -->
    <template id="welcome-template">
        <div class="welcome" id="welcome">
            <div class="welcome-icon">🌿</div>
            <h2>Ayurveda IP Advisor</h2>
            <p>Get AI-powered guidance on Ayurveda intellectual property, drug regulations, and Access &amp; Benefit Sharing. Every claim is backed by statute citations.</p>
            <div class="examples">
                <button class="eq" onclick="ex(this)">Is my Ashwagandha beverage an Ayurveda Aahara or a drug?</button>
                <button class="eq" onclick="ex(this)">Can I patent a classical Ayurvedic formulation?</button>
                <button class="eq" onclick="ex(this)">What ABS compliance do I need for neem-based products?</button>
                <button class="eq" onclick="ex(this)">How do I protect my proprietary ASU drug IP internationally?</button>
            </div>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const S={sid:crypto.randomUUID(),hist:[],j:'IN',loading:false};
        const msgs=document.getElementById('msgs');
        const qi=document.getElementById('qi');
        const sb=document.getElementById('sb');
        const sessionsList=document.getElementById('sessions-list');
        const welcomeHtml = document.getElementById('welcome-template').innerHTML;

        // Initialize
        msgs.innerHTML = welcomeHtml;
        loadSessions();

        function setJ(j,b){S.j=j;document.querySelectorAll('.tb').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
        function ex(b){qi.value=b.textContent;send()}
        qi.addEventListener('keydown',e=>{if(e.key==='Enter'&&!S.loading)send()});

        function md(t){
            return marked.parse(t);
        }

        function addMsg(role,content,meta){
            const w=document.getElementById('welcome');
            if(w) w.remove();
            
            const m=document.createElement('div');m.className='msg '+role;
            const av=document.createElement('div');av.className='av';av.textContent=role==='user'?'👤':'🌿';
            const bb=document.createElement('div');bb.className='bubble';
            bb.innerHTML=role==='bot'?md(content):content;
            
            if(role==='bot'&&meta){
                const mb=document.createElement('div');mb.className='meta';
                if(meta.sources_queried)meta.sources_queried.forEach(s=>{const c=document.createElement('span');c.className='chip cs';c.textContent=s;mb.appendChild(c)});
                if(meta.confidence){const c=document.createElement('span');c.className='chip c'+(meta.confidence==='high'?'h':meta.confidence==='medium'?'m':'l');c.textContent='Confidence: '+meta.confidence;mb.appendChild(c)}
                if(meta.jurisdiction){const c=document.createElement('span');c.className='chip cj';c.textContent='Jurisdiction: '+meta.jurisdiction;mb.appendChild(c)}
                bb.appendChild(mb);
            }
            m.appendChild(av);m.appendChild(bb);msgs.appendChild(m);msgs.scrollTop=msgs.scrollHeight;
        }

        function showThink(){
            const e=document.createElement('div');e.className='thinking';e.id='think';
            e.innerHTML='<div class="av" style="background:var(--card);border:1px solid var(--border)">🌿</div><div class="tdots"><span></span><span></span><span></span></div>';
            msgs.appendChild(e);msgs.scrollTop=msgs.scrollHeight;
        }
        function hideThink(){const e=document.getElementById('think');if(e)e.remove()}

        async function send(){
            const q=qi.value.trim();if(!q||S.loading)return;
            S.loading=true;sb.disabled=true;qi.value='';
            addMsg('user',q);
            S.hist.push({role:'user',content:q});
            showThink();
            
            try{
                const r=await fetch('/api/chat',{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({
                        query:q,
                        session_id:S.sid,
                        chat_history:S.hist.slice(-6)
                    })
                });
                const d=await r.json();
                hideThink();
                if(r.ok){
                    addMsg('bot',d.answer,d.metadata);
                    S.hist.push({role:'assistant',content:d.answer});
                    // Reload sessions to update title if it's the first message
                    if(S.hist.length <= 2) loadSessions();
                }
                else addMsg('bot','⚠️ Error: '+(d.error||'Something went wrong.'));
            }catch(err){
                hideThink();
                addMsg('bot','⚠️ Connection error: '+err.message);
            }
            S.loading=false;sb.disabled=false;qi.focus();
        }

        // --- Session Management ---
        async function loadSessions() {
            try {
                const res = await fetch('/api/sessions');
                const data = await res.json();
                
                sessionsList.innerHTML = '<div class="sidebar-title">Recents</div>';
                if(data.sessions && data.sessions.length > 0) {
                    data.sessions.forEach(sess => {
                        const div = document.createElement('div');
                        div.className = 'session-item' + (sess.id === S.sid ? ' active' : '');
                        div.textContent = sess.title || 'New Chat';
                        div.dataset.sid = sess.id;
                        div.onclick = () => loadChat(sess.id);
                        sessionsList.appendChild(div);
                    });
                }
            } catch (err) {
                console.error("Failed to load sessions", err);
            }
        }

        function newChat() {
            S.sid = crypto.randomUUID();
            S.hist = [];
            msgs.innerHTML = welcomeHtml;
            document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
        }

        async function loadChat(sid) {
            if(S.loading) return;
            S.sid = sid;
            S.hist = [];
            msgs.innerHTML = '';
            
            // Update UI active state immediately
            document.querySelectorAll('.session-item').forEach(el => {
                el.classList.toggle('active', el.dataset.sid === sid);
            });

            try {
                const res = await fetch(`/api/chat/${sid}`);
                const data = await res.json();
                
                if(data.history && data.history.length > 0) {
                    data.history.forEach(msg => {
                        S.hist.push({role: msg.role, content: msg.content});
                        addMsg(msg.role, msg.content);
                    });
                } else {
                    msgs.innerHTML = welcomeHtml;
                }
            } catch (err) {
                console.error("Failed to load chat history", err);
                msgs.innerHTML = '<div style="padding:20px;color:red;">Error loading chat history.</div>';
            }
        }
    </script>
</body>
</html>
